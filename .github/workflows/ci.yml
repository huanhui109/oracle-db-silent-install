name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters here: /bin/bash is 3.2, which is where the portability
        # bugs live (printf option parsing, no ${var,,}, no associative arrays).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version | head -1

      - name: Syntax check every script
        run: |
          for f in scripts/*.sh tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck -S warning -x scripts/*.sh tests/*.sh

      - name: Offline test suite
        run: bash tests/run_tests.sh

      - name: Skill frontmatter is parseable
        run: |
          head -1 SKILL.md | grep -qx -- '---'
          grep -q '^name: oracle-db-silent-install$' SKILL.md
          grep -q '^description: ' SKILL.md
